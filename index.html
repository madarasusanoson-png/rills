<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Join WhatsApp Group</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 80px;
            background-color: #f0f2f5;
            margin: 0;
        }

        h2 {
            color: #333;
            margin-bottom: 10px;
        }

        p {
            color: #666;
            margin-bottom: 30px;
        }

        /* Styled anchor tag to look like a premium button */
        .whatsapp-btn {
            display: inline-block;
            background-color: #25D366; /* Official WhatsApp Green */
            color: white;
            padding: 16px 30px;
            font-size: 18px;
            font-weight: bold;
            text-decoration: none;
            border-radius: 25px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: background-color 0.2s, transform 0.1s;
        }

        /* Hover & Tap effects */
        .whatsapp-btn:hover {
            background-color: #20ba5a;
        }

        .whatsapp-btn:active {
            transform: scale(0.98);
        }
    </style>
</head>

<body>

    <h2>Join our Group Chat</h2>
    <p>Click the button below to connect with us on WhatsApp.</p>
p
    <a href="https://earnprogressivelywithh.lovable.app" class="whatsapp-btn">
        Click to Open in WhatsApp
    </a>

</body>
</html>
